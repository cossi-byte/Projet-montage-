# Déploiement sur un serveur (VPS) : transfert + analyse + HTTPS automatique (+ n8n en option).
#   1. cp deploy/.env.exemple deploy/.env  puis remplir
#   2. docker compose -f deploy/docker-compose.yml up -d --build
#   3. Ouvrir https://VOTRE_DOMAINE sur le téléphone.
services:
  studio:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: .env
    volumes: ["${STUDIO_DISK:-./donnees}:/data"]   # le disque qui recevra les vidéos
  caddy:  # HTTPS automatique (Let's Encrypt) — obligatoire pour l'interface web
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${DOMAINE} --to studio:8765
    volumes: ["caddy_data:/data"]
  n8n:  # automatisations (optionnel) : docker compose --profile automatisation up -d
    image: n8nio/n8n:latest
    profiles: ["automatisation"]
    restart: unless-stopped
    ports: ["127.0.0.1:5678:5678"]   # accessible uniquement via tunnel SSH ou Tailscale
    environment: [GENERIC_TIMEZONE=Africa/Lome, TZ=Africa/Lome]
    volumes: ["n8n_data:/home/node/.n8n"]
volumes: { caddy_data: {}, n8n_data: {} }
